[uwsgi]
socket = 0.0.0.0:8000
# http://localhost:8000/
protocol = http
module = uWSGI:app
plugin = python3

# Runs prep.py once, before the app loads. It writes the files the app only reads.
# %d is this file's folder (source/), with a trailing slash
exec-asap = python3 %dprep.py

# Prevents uWSGI from starting if it cannot successfully load application module
# need-app = true

# Only needed when you want thread support without setting a thread count
# enable-threads = true

# master = true
# processes = 4
# threads = 2
