[uwsgi]
socket = /run/uwsgi/woXrooX_x.sock

# Gives Nginx permission to access the socket
chmod-socket = 660
module = uWSGI:app
plugin = python3

# Runs prep.py once per start and reload, before any worker loads the app.
# It writes the files the workers only read. If it fails, uWSGI doesn't start.
# %d is this file's folder (source/), with a trailing slash
exec-asap = python3 %dprep.py

# Prevents uWSGI from starting if it cannot successfully load application module
# With lazy-apps it applies to every worker, including respawned ones. systemd's Restart=always then starts uWSGI again.
need-app = true

# Main process that manages workers, auto-restarts crashed workers
master = true
processes = 4
threads = 2
lazy-apps = true

# Log to file instead of terminal
logto = /var/log/uwsgi/woXrooX_x.log

# Cleans up the socket file when uWSGI stops
vacuum = true

# Plays nicely with systemd for clean shutdowns
die-on-term = true
